name: Build

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

jobs:
  qa:
    name: QA
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --check src/main.js
      - run: node --check src/preload.js
      - run: node --check src/renderer.js
      - run: node --check src/importer-core.js
      - run: node --check tests/qa-importer.js
      - run: npm audit --omit=dev
      - run: npm run qa

  build-mac:
    name: Build macOS DMG
    runs-on: macos-latest
    needs: qa
    env:
      MAC_SIGN_IDENTITY: ${{ secrets.MAC_SIGN_IDENTITY }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Bundle Google OAuth client
        env:
          GOOGLE_OAUTH_CLIENT_JSON: ${{ secrets.GOOGLE_OAUTH_CLIENT_JSON }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
        run: npm run prepare:google-auth
      - name: Build ad-hoc macOS DMG
        if: ${{ env.MAC_SIGN_IDENTITY == '' }}
        run: CSC_IDENTITY_AUTO_DISCOVERY=false npm run dist:mac
      - name: Import Developer ID certificate
        if: ${{ env.MAC_SIGN_IDENTITY != '' }}
        env:
          MAC_CERTIFICATE_P12: ${{ secrets.MAC_CERTIFICATE_P12 }}
          MAC_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          echo "$MAC_CERTIFICATE_P12" | base64 --decode > certificate.p12
          security import certificate.p12 -k build.keychain -P "$MAC_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" build.keychain
      - name: Build notarized macOS DMG
        if: ${{ env.MAC_SIGN_IDENTITY != '' }}
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run dist:mac
      - uses: actions/upload-artifact@v7
        with:
          name: mac-dmg
          path: dist/*.dmg

  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest
    needs: qa
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Bundle Google OAuth client
        env:
          GOOGLE_OAUTH_CLIENT_JSON: ${{ secrets.GOOGLE_OAUTH_CLIENT_JSON }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
        run: npm run prepare:google-auth
      - run: npm run dist:win
      - uses: actions/upload-artifact@v7
        with:
          name: windows-exe
          path: dist/*.exe

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - build-mac
      - build-windows
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          gh release create "$TAG_NAME" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Snapchat Memories Importer ${TAG_NAME#v} Beta" \
            --notes-file RELEASE_NOTES.md \
            --prerelease \
            --latest || \
          gh release upload "$TAG_NAME" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
