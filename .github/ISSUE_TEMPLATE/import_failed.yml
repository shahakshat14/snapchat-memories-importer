name: Import failed
description: Report a failed Snapchat export import or preview.
title: "Import failed: "
labels: ["bug", "import"]
body:
  - type: markdown
    attributes:
      value: "Please do not attach Snapchat export zips or private media."
  - type: input
    id: version
    attributes:
      label: App version
      placeholder: "0.1.0"
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS
        - Windows
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include the exact error message if you have it.
    validations:
      required: true
  - type: textarea
    id: support_bundle
    attributes:
      label: Support bundle summary
      description: Paste relevant non-private lines from the Support Bundle JSON.
